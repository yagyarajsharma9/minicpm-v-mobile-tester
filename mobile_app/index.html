<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6f64" />
    <title>MiniCPM Mobile</title>
    <link rel="manifest" href="/mobile_app/manifest.webmanifest" />
    <link rel="stylesheet" href="/mobile_app/styles.css" />
  </head>
  <body>
    <main class="phone">
      <header class="appbar">
        <div>
          <h1>MiniCPM Mobile</h1>
          <p id="status">Offline shell ready</p>
        </div>
        <button id="settingsBtn" type="button" aria-label="Settings">⚙</button>
      </header>

      <section id="settings" class="settings" hidden>
        <label>
          Engine
          <select id="engine">
            <option value="server">Server API</option>
            <option value="offline">Offline device</option>
          </select>
        </label>
        <label>
          Server endpoint
          <input id="endpoint" inputmode="url" value="http://127.0.0.1:7860/api/chat" />
        </label>
        <label>
          Model
          <input id="model" value="openbmb/MiniCPM-V-4.6" />
        </label>
        <label>
          Max tokens
          <input id="maxTokens" type="number" min="32" max="2048" value="256" />
        </label>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label class="attach">
          +
          <input id="imageInput" type="file" accept="image/*" capture="environment" />
        </label>
        <textarea id="prompt" rows="1" placeholder="Ask MiniCPM..."></textarea>
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </main>

    <script src="/mobile_app/app.js"></script>
  </body>
</html>
